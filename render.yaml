services:
  - type: web
    name: sgct
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        generateValue: true
      - key: PORT
        value: 10000
      - key: DB_CONNECTION
        value: pgsql
